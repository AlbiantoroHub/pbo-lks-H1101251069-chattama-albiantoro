<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Perpustakaan</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans">
    <!-- Header Biru Perpustakaan -->
    <header class="bg-blue-600 text-white shadow-md">
        <div class="container mx-auto px-6 py-4 flex flex-col md:flex-row justify-between items-center">
            <h1 class="text-2xl font-bold tracking-wide mb-3 md:mb-0">Perpustakaan</h1>
            <nav class="flex space-x-6">
                <a href="#dashboard" class="nav-link font-medium hover:text-blue-200 transition">Dashboard</a>
                <a href="#books" class="nav-link font-medium hover:text-blue-200 transition">Buku</a>
                <a href="#categories" class="nav-link font-medium hover:text-blue-200 transition">Kategori</a>
            </nav>
        </div>
    </header>

    <!-- Wadah Toast Notifikasi -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col space-y-2"></div>

    <!-- Area Konten Utama -->
    <main class="container mx-auto px-6 py-8">
        <div id="content" class="bg-white rounded-lg shadow p-6">
            <p class="text-gray-500 italic">Memuat aplikasi...</p>
        </div>
    </main>

    <!-- Modul JavaScript Lengkap -->
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/pages/dashboard.js"></script>
    <script src="js/pages/books.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
